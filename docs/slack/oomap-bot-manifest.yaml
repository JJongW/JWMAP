# Slack 앱 만들기: https://api.slack.com/apps → Create New App → From a manifest → 이 내용 붙여넣기
display_information:
  name: OOMAP 봇
  description: 카드뉴스 검수 요청, DB 누락 알림, 게시 알림, 스레드 대화
  background_color: "#E56C4E"
features:
  bot_user:
    display_name: oomap
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # 알림·답장 보내기
      - files:write         # 카드 이미지 첨부
      - channels:history    # 채널 스레드 답장 읽기
      - groups:history      # 비공개 채널이면 필요
      - app_mentions:read   # @oomap 태그 받기
      - reactions:write     # 처리 중 표시(👀)
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true   # 공개 서버 없이 Mac mini에서 바로 받는다
